spring:
  application:
    name: hotelsearch
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:hotel}
    password: ${DB_PASSWORD:hotel}
  sql:
    init:
      mode: always
  kafka:
    listener:
      concurrency: 3
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      max-poll-records: 500
      group-id: search-persister
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.sling.hotelsearch.infrastructure.kafka.SearchMessage
        spring.json.trusted.packages: com.sling.hotelsearch.infrastructure.kafka
        spring.json.use.type.headers: false
    hikari:
      pool:
        maximum-pool-size: 20